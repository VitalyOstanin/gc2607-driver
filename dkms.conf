# DKMS configuration for the GalaxyCore GC2607 V4L2 sensor driver.
#
#   sudo dkms add .
#   sudo dkms install gc2607-driver/1.0
#
# This module is self-contained; it does not replace any in-tree module.

PACKAGE_NAME="gc2607-driver"
PACKAGE_VERSION="1.0"

# Module name as produced by the Makefile (gc2607.ko).
BUILT_MODULE_NAME[0]="gc2607"

# Ignored on Ubuntu/Fedora/RHEL/SUSE (DKMS picks the distro updates dir);
# used on other distributions and kept in the depmod search path.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# DKMS appends "KERNELRELEASE=${kernelver} -j${parallel_jobs}" automatically.
# KDIR must point at the *target* kernel, not the running one (autoinstall on a
# freshly installed kernel runs while a different kernel is booted).
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"

# Rebuild automatically for every newly installed kernel.
AUTOINSTALL="yes"

# Build only on the 7.x kernel series. The driver uses APIs introduced in 7.0
# (e.g. devm_v4l2_sensor_clk_get()) that are absent on older kernels, so a build
# on a still-installed 6.x kernel fails. With AUTOINSTALL the deb postinst builds
# for every installed kernel; this regex makes DKMS skip non-matching kernels
# cleanly instead of failing the whole package installation.
BUILD_EXCLUSIVE_KERNEL="^7\."
